# Use the LAMP stack container (Apache + PHP + MariaDB) with PHP 8.4.
type: lamp
php: 8.4
database: mariadb:11.4

# The sample database can be obtained at:
# https://probosupportfiles.blob.core.windows.net/utils/wordpress.sql.gz
assets:
  - wordpress.sql.gz

steps:
  - name: Setup WordPress
    plugin: WordPressApp
    subDirectory: wordpress
    database: wordpress.sql.gz
    databasePrefix: 'ex_'
    databaseGzipped: true
    flushCaches: true
    updatePlugins: true
